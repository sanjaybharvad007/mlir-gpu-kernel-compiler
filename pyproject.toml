[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorjit"
version = "0.3.0"
description = "A JIT tensor compiler: tensor IR -> fusion -> C/Triton/MLIR codegen, with a torch.compile backend"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy", "pybind11>=2.11"]

[project.optional-dependencies]
gpu = ["triton>=3.0"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["tensorjit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:logging"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly: ruff's default rule set changed in 0.16 and CI installs the latest release.
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"mlir/test/lit.cfg.py" = ["F821"]   # `config` / `lit_config` are injected by lit
