name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy triton pytest ruff pybind11 -e .     # pybind11: builds the C++ runtime in tests
      - run: ruff check .
      - run: pytest -q -rfE --tb=short       # C backend, MLIR emission, torch.compile backend
      - run: TRITON_INTERPRET=1 pytest -q -rfE --tb=short tests/test_backends.py -k triton   # Triton codegen via interpreter
